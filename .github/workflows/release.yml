name: Release stable firmware

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
    paths:
      - release-version.txt
  workflow_dispatch:
    inputs:
      version:
        description: Stable semantic version, for example 0.10.1
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.2
    outputs:
      release_tag: ${{ steps.release_meta.outputs.tag }}
      release_version: ${{ steps.release_meta.outputs.version }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Resolve and validate release version
        id: release_meta
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$REQUESTED_VERSION"
          else
            version="$(tr -d '[:space:]' < release-version.txt)"
          fi
          grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' <<< "$version"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'tag=v%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Run host protocol tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Imain \
            tests/test_vesc_can_protocol.c main/vesc_can_protocol.c -lm \
            -o /tmp/vesc_can_test
          /tmp/vesc_can_test
          python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Build exact release with ESP-IDF 5.5.2
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release_meta.outputs.version }}
        run: |
          source /opt/esp/idf/export.sh
          export EBIKE_PROJECT_VER="$RELEASE_VERSION"
          test "$(idf.py --version)" = "ESP-IDF v5.5.2"
          rm -f sdkconfig sdkconfig.old
          idf.py set-target esp32s3
          idf.py build

      - name: Package release
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release_meta.outputs.version }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
        run: |
          python3 scripts/package_firmware.py build dist
          python3 scripts/create_manifest.py \
            --version "$RELEASE_VERSION" \
            --tag "$RELEASE_TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --firmware dist/ebike-dashboard.bin \
            --output dist/manifest.json
          cd dist
          zip -qr first-usb-flash.zip first-usb-flash

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: stable-release
          path: dist/
          retention-days: 30
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download verified build
        uses: actions/download-artifact@v5
        with:
          name: stable-release
          path: release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            release/ebike-dashboard.bin \
            release/manifest.json \
            release/first-usb-flash.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "E-bike dashboard $RELEASE_TAG" \
            --generate-notes \
            --latest
